events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;

    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name work.eqourse.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/horilla-acme;
            try_files $uri =404;
        }

        location / {
            return 308 https://work.eqourse.com$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        server_name work.eqourse.com;
        ssl_certificate /etc/letsencrypt/live/work.eqourse.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/work.eqourse.com/privkey.pem;
        client_max_body_size 50M;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

        # Resolve the current web container IP after Compose replaces it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $django http://web:8000;
        proxy_set_header Host work.eqourse.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;

        location ~ ^/(login|api/auth/login)/?$ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass $django;
        }

        location ~ ^/metrics(?:/|$) {
            return 404;
        }

        location = /auth/google/callback/ {
            access_log off;
            proxy_pass $django;
        }

        location /static/ {
            alias /static/;
            expires 1h;
        }

        # Django authorizes requests for employee media.
        location / {
            proxy_pass $django;
        }
    }
}
