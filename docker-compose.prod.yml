# Production overlay for Horilla HR (open-source).
#
# Usage:
#   See deploy/README.md for environment setup, TLS bootstrap, and deployment.
#
# Requires Docker Compose v2.24+ (!override / !reset merge).
# Does not bind-mount source code; uses image contents + named volumes.

services:
  web:
    restart: unless-stopped
    env_file:
      - .env
    environment: !override
      DEBUG: "0"
      HORILLA_ENV: production
      DB_HOST: db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?Set DB_INIT_PASSWORD in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      SECURE_SSL_REDIRECT: "1"
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-300}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      # The client IP for login lockouts and the office-IP restriction comes
      # from X-Forwarded-For only on connections from these proxies.
      HORILLA_TRUSTED_PROXIES: ${HORILLA_TRUSTED_PROXIES:-nginx}
    volumes: !override
      - staticfiles:/app/staticfiles
      - media:/app/media
    ports: !reset []
    healthcheck:
      test: [CMD, curl, -fsS, -H, "Host: work.eqourse.com", -H, "X-Forwarded-Proto: https", "http://localhost:8000/health/"]
      # A fresh database on a t3.large can spend more than ten minutes
      # applying migrations before Gunicorn binds.
      start_period: 25m

  # Single replica: see the comment on this service in docker-compose.yml.
  # Mirrors web's environment so both read the same .env, minus the HTTP-only
  # settings and with release tasks left to the web container.
  scheduler:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment: !override
      DEBUG: "0"
      HORILLA_ENV: production
      DB_HOST: db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?Set DB_INIT_PASSWORD in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      HORILLA_SKIP_RELEASE_TASKS: "1"
    volumes: !override
      - media:/app/media
    deploy:
      replicas: 1

  db:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horilla_db}
      POSTGRES_USER: ${POSTGRES_USER:-horilla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
          "ping",
        ]

  nginx:
    restart: unless-stopped
    ports:
      - "443:443"
    volumes: !override
      - staticfiles:/static:ro
      - ./deploy/nginx/work.eqourse.com.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/horilla-acme:/var/www/horilla-acme:ro
    # Clear the "production" profile so nginx starts with `make prod`
    # without requiring --profile production.
    profiles: !reset []
