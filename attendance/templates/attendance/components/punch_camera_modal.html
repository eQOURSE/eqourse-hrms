<style>
    #eqourse-punch-modal { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 23, 42, .68); }
    #eqourse-punch-modal.is-open { display: flex; }
    .eqourse-punch-dialog { width: min(100%, 460px); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; border-radius: 16px; background: #fff; box-shadow: 0 20px 60px rgba(15, 23, 42, .28); }
    .eqourse-punch-dialog h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .eqourse-punch-dialog p { margin: 0 0 12px; color: #475569; }
    .eqourse-punch-camera { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; border-radius: 12px; background: #0f172a; }
    .eqourse-punch-camera[hidden], .eqourse-punch-preview[hidden] { display: none; }
    .eqourse-punch-preview { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; }
    .eqourse-punch-status { min-height: 22px; margin: 12px 0 6px; font-size: .92rem; }
    .eqourse-punch-status.is-error { color: #b42318; }
    .eqourse-punch-status.is-ok { color: #067647; }
    .eqourse-punch-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 14px; }
    .eqourse-punch-metric { padding: 8px 10px; border-radius: 8px; background: #f8fafc; font-size: .85rem; }
    .eqourse-punch-metric strong { display: block; color: #0f172a; font-size: .95rem; }
    .eqourse-punch-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .eqourse-punch-actions button { min-height: 42px; }
    @media (max-width: 480px) { #eqourse-punch-modal { padding: 8px; } .eqourse-punch-dialog { padding: 14px; } .eqourse-punch-actions button { flex: 1 1 45%; } }
</style>

<script>
(function () {
    if (window.__eqoursePunchCameraBound) return;
    window.__eqoursePunchCameraBound = true;
    const OFFICE = { latitude: 25.14402, longitude: 75.84506, radius: 50, maxAccuracy: 25 };
    let activeButton = null, cameraStream = null, capturedPhoto = null, locationState = null;
    const labels = { gettingLocation: "Getting your location…", cameraStarting: "Starting the front camera…", cameraReady: "Position your face, then choose Take Photo." };

    function ensureModal() {
        let modal = document.getElementById("eqourse-punch-modal");
        if (modal) return modal;
        modal = document.createElement("div"); modal.id = "eqourse-punch-modal";
        modal.innerHTML = `<section class="eqourse-punch-dialog" role="dialog" aria-modal="true" aria-labelledby="eqourse-punch-title">
            <h2 id="eqourse-punch-title"></h2><p id="eqourse-punch-subtitle"></p>
            <video id="eqourse-punch-video" class="eqourse-punch-camera" autoplay muted playsinline></video>
            <img id="eqourse-punch-preview" class="eqourse-punch-preview" alt="Attendance photo preview" hidden>
            <div id="eqourse-punch-status" class="eqourse-punch-status" role="status" aria-live="polite"></div>
            <div class="eqourse-punch-metrics" aria-live="polite"><div class="eqourse-punch-metric">Estimated distance<strong id="eqourse-punch-distance">—</strong></div><div class="eqourse-punch-metric">GPS accuracy<strong id="eqourse-punch-accuracy">—</strong></div></div>
            <div class="eqourse-punch-actions"><button type="button" class="oh-btn oh-btn--secondary" data-punch-cancel>Cancel</button><button type="button" class="oh-btn oh-btn--secondary" data-punch-retry-location hidden>Retry Location</button><button type="button" class="oh-btn oh-btn--secondary" data-punch-retake hidden>Retake</button><button type="button" class="oh-btn oh-btn--secondary" data-punch-take>Take Photo</button><button type="button" class="oh-btn oh-btn--success" data-punch-submit disabled>Submit</button></div>
        </section>`;
        document.body.appendChild(modal); return modal;
    }
    function els() { const modal = ensureModal(); return { modal, video: modal.querySelector("#eqourse-punch-video"), preview: modal.querySelector("#eqourse-punch-preview"), status: modal.querySelector("#eqourse-punch-status"), distance: modal.querySelector("#eqourse-punch-distance"), accuracy: modal.querySelector("#eqourse-punch-accuracy"), take: modal.querySelector("[data-punch-take]"), retake: modal.querySelector("[data-punch-retake]"), retry: modal.querySelector("[data-punch-retry-location]"), submit: modal.querySelector("[data-punch-submit]") }; }
    function setStatus(message, error) { const { status } = els(); status.textContent = message; status.classList.toggle("is-error", Boolean(error)); status.classList.toggle("is-ok", !error && Boolean(message)); }
    function stopCamera() { if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop()); cameraStream = null; const { video } = els(); video.srcObject = null; }
    function resetModal() { stopCamera(); activeButton = null; capturedPhoto = null; locationState = null; const { modal, video, preview, take, retake, retry, submit, distance, accuracy } = els(); modal.classList.remove("is-open"); video.hidden = false; preview.hidden = true; preview.removeAttribute("src"); take.hidden = false; retake.hidden = true; retry.hidden = true; submit.disabled = true; distance.textContent = "—"; accuracy.textContent = "—"; setStatus(""); }
    function distanceMeters(lat1, lon1, lat2, lon2) { const r = 6371000, rad = (value) => value * Math.PI / 180, dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1), a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2; return r * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); }
    function locationError(error) { const { retry } = els(); retry.hidden = false; if (!navigator.geolocation) return "Location is unavailable in this browser. Enable location services and retry."; if (!error || error.code === 1) return "Location permission was denied. Allow location access and retry."; if (error.code === 2) return "Your location is unavailable. Turn on location services and retry."; if (error.code === 3) return "Getting your location timed out. Move to a place with a clearer GPS signal and retry."; return "We could not get a reliable location. Retry Location."; }
    function getFreshLocation() { const { retry, submit } = els(); locationState = null; submit.disabled = true; retry.hidden = true; setStatus(labels.gettingLocation); if (!navigator.geolocation) return setStatus(locationError(), true); navigator.geolocation.getCurrentPosition((position) => { const accuracy = Number(position.coords.accuracy), distance = distanceMeters(OFFICE.latitude, OFFICE.longitude, position.coords.latitude, position.coords.longitude), usableAccuracy = Number.isFinite(accuracy) && accuracy >= 0, margin = distance + (usableAccuracy ? accuracy : Infinity), { distance: distanceEl, accuracy: accuracyEl, retry: retryEl } = els(); distanceEl.textContent = Number.isFinite(distance) ? `${distance.toFixed(1)} m` : "Unavailable"; accuracyEl.textContent = usableAccuracy ? `±${accuracy.toFixed(1)} m` : "Unavailable"; if (!usableAccuracy || accuracy > OFFICE.maxAccuracy) { setStatus(`GPS accuracy is ${usableAccuracy ? `±${accuracy.toFixed(1)} m` : "unavailable"}; it must be ±${OFFICE.maxAccuracy} m or better. Retry your location.`, true); retryEl.hidden = false; return; } locationState = { position, distance, accuracy, margin }; if (margin > OFFICE.radius) setStatus(`The accuracy margin reaches ${margin.toFixed(1)} m, beyond the ${OFFICE.radius}-m office boundary. Retry Location or submit if you are on approved WFH/remote work; the server will apply the final rule.`, true); else setStatus("Location is ready. Confirm the photo to continue."); els().submit.disabled = !capturedPhoto; }, (error) => setStatus(locationError(error), true), { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }); }
    async function startCamera() { const { video, take } = els(); setStatus(labels.cameraStarting); if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("Camera access is unavailable in this browser."); cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "user" } }, audio: false }); video.srcObject = cameraStream; await video.play(); take.disabled = false; setStatus(labels.cameraReady); }
    function takePhoto() { const { video, preview, take, retake, submit } = els(); if (!cameraStream || !video.videoWidth || !video.videoHeight) { startCamera().catch((error) => setStatus(error.message || "Camera permission was denied. Allow camera access and retry.", true)); return; } const canvas = document.createElement("canvas"); canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext("2d").drawImage(video, 0, 0); canvas.toBlob((blob) => { if (!blob) return setStatus("The camera did not return an image. Please retake the photo.", true); capturedPhoto = blob; preview.src = URL.createObjectURL(blob); preview.hidden = false; video.hidden = true; stopCamera(); take.hidden = true; retake.hidden = false; submit.disabled = !locationState; setStatus(locationState ? "Photo captured. Review it, then choose Submit." : "Photo captured. Waiting for a reliable location."); }, "image/jpeg", .9); }
    async function retakePhoto() { const { video, preview, take, retake, submit } = els(); capturedPhoto = null; preview.hidden = true; preview.removeAttribute("src"); video.hidden = false; take.hidden = false; retake.hidden = true; submit.disabled = true; try { await startCamera(); } catch (error) { setStatus(error.message || "Camera permission is required for attendance.", true); } }
    async function submitPunch() { const { submit } = els(); if (!activeButton || !capturedPhoto || !locationState) return setStatus("Take a photo and confirm it after a reliable location is ready.", true); submit.disabled = true; setStatus("Checking your photo and recording attendance…"); const form = new FormData(); form.append("face_image", capturedPhoto, "attendance-face.jpg"); form.append("latitude", locationState.position.coords.latitude); form.append("longitude", locationState.position.coords.longitude); form.append("accuracy", locationState.accuracy); form.append("location_timestamp", locationState.position.timestamp); try { const response = await fetch(activeButton.dataset.punchUrl, { method: "POST", body: form, credentials: "same-origin", headers: { "HX-Request": "true", "X-Punch-Client": "1", "X-CSRFToken": activeButton.dataset.csrf } }); const contentType = response.headers.get("content-type") || ""; if (!response.ok) { const payload = contentType.includes("application/json") ? await response.json() : {}; throw new Error(payload.error || "Attendance could not be recorded. Please retry."); } const target = document.querySelector("#attendance-activity-container"); if (target) target.innerHTML = await response.text(); resetModal(); } catch (error) { setStatus(error.message || "Attendance could not be recorded. Please retry.", true); els().submit.disabled = false; els().retake.hidden = false; } }
    document.addEventListener("click", async (event) => { const button = event.target.closest(".eqourse-punch-btn"); if (!button || button.disabled) return; event.preventDefault(); activeButton = button; const { modal } = els(); modal.querySelector("#eqourse-punch-title").textContent = button.dataset.punchAction === "check-out" ? "Confirm check-out" : "Confirm check-in"; modal.querySelector("#eqourse-punch-subtitle").textContent = "Use the live front camera and a fresh location. Nothing is sent until you choose Submit."; modal.classList.add("is-open"); try { await startCamera(); } catch (error) { setStatus(error.message || "Camera permission was denied. Allow camera access and retry.", true); } getFreshLocation(); });
    document.addEventListener("click", (event) => { if (event.target.closest("[data-punch-cancel]")) resetModal(); if (event.target.closest("[data-punch-take]")) takePhoto(); if (event.target.closest("[data-punch-retake]")) retakePhoto(); if (event.target.closest("[data-punch-retry-location]")) getFreshLocation(); if (event.target.closest("[data-punch-submit]")) submitPunch(); });
})();
</script>
