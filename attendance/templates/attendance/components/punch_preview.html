{% load static i18n %}
<link rel="stylesheet" href="{% static 'attendance/mobile-punch.css' %}?v=3">
<script src="{% static 'attendance/mobile-punch.js' %}?v=3" defer></script>
<template id="eqourse-punch-template">
    <dialog class="eqourse-punch-dialog" aria-labelledby="eqourse-punch-title">
        <h2 id="eqourse-punch-title"></h2>
        <p data-checkout-elapsed hidden>{% trans "Time worked" %}</p>
        <p>{% trans "Frame your face in the preview, then take and review your photo." %}</p>
        <div class="eqourse-punch-preview">
            <video autoplay playsinline muted aria-label="{% trans 'Live camera preview' %}"></video>
            <img hidden alt="{% trans 'Photo to submit for attendance' %}">
        </div>
        <p data-camera-status role="status"></p>
        <div class="eqourse-punch-location">
            <p data-location-status role="status"></p>
            <button type="button" data-retry-location>{% trans "Retry location" %}</button>
        </div>
        <p data-punch-error role="alert" hidden></p>
        <div class="eqourse-punch-actions">
            <button type="button" data-close-punch>{% trans "Cancel" %}</button>
            <button type="button" data-take-photo disabled>{% trans "Take photo" %}</button>
            <button type="button" data-retake-photo hidden>{% trans "Retake" %}</button>
            <button type="button" data-submit-punch disabled>{% trans "Submit" %}</button>
        </div>
    </dialog>
</template>
